
server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # game assets: a missing file is a 404, never index.html (Phaser would draw
    # HTML as a broken texture)
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
